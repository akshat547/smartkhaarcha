<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4"
        flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="25" fill="#17132B"/>

  <!-- Gradient Logo Box -->
  <rect x="10" y="10" width="80" height="80"
        rx="22" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Rupee Symbol -->
  <text x="50" y="67"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="58"
        font-weight="bold"
        fill="#FFFFFF">₹</text>

  <!-- Green Growth Dot -->
  <circle cx="76" cy="25" r="7" fill="#34D399"/>
  <circle cx="76" cy="25" r="3" fill="#FFFFFF"/>
</svg>